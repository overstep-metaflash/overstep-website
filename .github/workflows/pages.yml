name: Test, build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://overstep-metaflash.github.io/overstep-website/

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      rights_approved: ${{ steps.rights.outputs.approved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-migration.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: "2026.11.8"
          install_args: "aqua:gohugoio/hugo aqua:gitleaks/gitleaks"
      - name: Install test and sanitization dependencies
        run: python -m pip install -r requirements-migration.txt
      - name: Verify maintained theme files
        run: python scripts/sync_theme.py --check
      - name: Validate comment sanitization and local avatars
        run: python scripts/sanitize_comments.py --check
      - name: Read the explicit media-rights release gate
        id: rights
        run: |
          python - <<'PY'
          import json, os
          approved = json.load(open('docs/media-rights.json'))['publication_approved'] is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('approved=' + str(approved).lower() + '\n')
          PY
      - name: Python regression tests
        run: |
          export HUGO_BIN="$(mise which hugo)"
          python -m unittest discover -s tests -v
      - name: JavaScript player tests
        run: node --test tests/test_*.cjs
      - name: Scan committed changes for secrets
        run: mise exec -- gitleaks git --redact --no-banner --log-opts="-1"
      - name: Build Hugo with warnings treated as errors
        run: mise exec -- hugo build --destination public --environment production --baseURL "$SITE_BASE_URL" --buildDrafts=false --buildFuture=false --buildExpired=false --panicOnWarning
      - name: Prepare legacy media paths for the project preview
        run: python scripts/prepare_pages.py --directory public --base-url "$SITE_BASE_URL"
      - name: Validate generated output
        run: python scripts/validate_site.py --directory public --base-url "$SITE_BASE_URL"
      - name: Validate the restored Metaflash section
        run: python scripts/validate_metaflash.py --directory public --base-url "$SITE_BASE_URL"
      - name: Validate the independent media archive
        run: python scripts/validate_media_archive.py --directory public --base-url "$SITE_BASE_URL"
      - name: Upload site artifact after release approval
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_RELEASE_APPROVED == 'true' && steps.rights.outputs.approved == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 3

  deploy:
    # Keep this variable unset/false until media rights and the release review are approved.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_RELEASE_APPROVED == 'true' && needs.build.outputs.rights_approved == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages after release approval
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

